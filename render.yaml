services:
  - type: web
    name: darkomat
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darkomat-db
          property: internalConnectionString

databases:
  - name: darkomat-db
    plan: free
    databaseName: darkomat
    user: darkomat
